version: '3.8'

# ============================================
# 生产环境部署
# 前后端+Qdrant+ES+监控都在服务器Docker
# 使用方式: docker-compose --env-file .env.prod -f docker-compose.yml up -d
# ============================================

services:
  # ============================================
  # RAG Backend 应用
  # ============================================
  rag-backend:
    container_name: rag-backend
    image: rag-medical-backend:latest
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=${JAVA_OPTS:- -Xms512m -Xmx1024m -XX:+UseG1GC}
      - APP_PORT=${APP_PORT:-8080}
      # 数据库
      - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-rag_medical}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Redis
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Qdrant
      - QDRANT_HOST=${QDRANT_HOST:-rag-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-qdrant_secret_key_2024}
      # Embedding
      - EMBEDDING_HOST=${EMBEDDING_HOST:-localhost}
      - EMBEDDING_PORT=${EMBEDDING_PORT:-28347}
      # LLM
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_PORT=${LLM_PORT:-28347}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:11434}
      - LLM_MODEL=${LLM_MODEL:-Qwen3.6-27BB}
      # MinIO
      - MINIO_HOST=${MINIO_HOST:-localhost}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      # Etcd
      - ETCD_HOST=${ETCD_HOST:-localhost}
      - ETCD_PORT=${ETCD_PORT:-2379}
      - ETCD_URIS=${ETCD_URIS:-http://localhost:2379}
      # Elasticsearch
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-rag-elasticsearch}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_URIS=${ELASTICSEARCH_URIS:-http://rag-elasticsearch:9200}
      # OCR (AI SDK统一服务)
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://localhost:28347}
      - OCR_FALLBACK_URL=${OCR_FALLBACK_URL:-http://localhost:28347}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_TIMEOUT=${OCR_TIMEOUT:-120000}
      # Batch OCR（多页合并识别，减少4倍请求数）
      - OCR_BATCH_ENABLED=${OCR_BATCH_ENABLED:-true}
      - OCR_BATCH_SIZE=${OCR_BATCH_SIZE:-4}
      - OCR_BATCH_READ_TIMEOUT=${OCR_BATCH_READ_TIMEOUT:-600000}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - backend_logs:/app/logs
    networks:
      - rag-network
    mem_limit: 2g
    cpus: 2.0

  # ============================================
  # RAG Frontend 应用
  # ============================================
  rag-frontend:
    container_name: rag-frontend
    image: rag-medical-frontend:latest
    restart: unless-stopped
    ports:
      - "18030:443"
    networks:
      - rag-network
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - rag-backend

  # ============================================
  # Qdrant 向量数据库
  # ============================================
  rag-qdrant:
    container_name: rag-qdrant
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-qdrant_secret_key_2024}
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__CLUSTER__ENABLED=false
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__MEMMAP_INDEX=true
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network
    mem_limit: 2g
    cpus: 2.0

  # ============================================
  # Elasticsearch 全文搜索引擎
  # ============================================
  # rag-elasticsearch:
  #   container_name: rag-elasticsearch
  #   image: elasticsearch:8.12.0
  #   restart: unless-stopped
  #   environment:
  #     - node.name=rag-elasticsearch-node
  #     - cluster.name=rag-elasticsearch-cluster
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "${ELASTICSEARCH_PORT:-9200}:9200"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   networks:
  #     - rag-network
  #   mem_limit: 1g
  #   cpus: 1.0
  #   ulimits:
  #     memlock:
  #       soft: -1
  #       hard: -1
  #     nofile:
  #       soft: 65536
  #       hard: 65536

  # ============================================
  # Prometheus 监控
  # ============================================
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.47.0}
    container_name: rag-monitoring-prometheus
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    restart: unless-stopped
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ../monitoring/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
      - '--query.max-concurrency=10'
      - '--web.enable-admin-api'
    user: root
    healthcheck:
        test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
    networks:
      - rag-network
    mem_limit: 1g
    cpus: 1.0

  # ============================================
  # Grafana 监控面板
  # ============================================
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.4.0}
    container_name: rag-monitoring-grafana
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-13000}
      - GF_DEFAULT_LOCALE=zh-Hans
      - GF_DEFAULT_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
    volumes:
      - ../monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    user: "472"
    networks:
      - rag-network
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5

  # ============================================
  # Redis Exporter (for Prometheus)
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.61.0}
    container_name: rag-monitoring-redis-exporter
    ports:
      - "${REDIS_EXPORTER_PORT:-19121}:9121"
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - rag-network
    mem_limit: 128m
    cpus: 0.25

# ============================================
# 网络配置
# ============================================
networks:
  rag-network:
    driver: bridge
    name: rag-network

# ============================================
# 数据卷配置
# ============================================
volumes:
  backend_logs:
    name: rag-backend-logs
  qdrant_data:
    name: rag-qdrant-data
  elasticsearch_data:
    name: rag-elasticsearch-data
  prom_data:
    name: rag-monitoring-prom-data
  grafana_data:
    name: rag-monitoring-grafana-data
