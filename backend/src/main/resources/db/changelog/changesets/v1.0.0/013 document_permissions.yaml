databaseChangeLog:
  - changeSet:
      id: create-document-permissions-table
      author: system
      changes:
        - createTable:
            tableName: document_permissions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: permission_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: granted_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
            indexes:
              - index:
                  name: idx_document_permissions_document_id
                  tableName: document_permissions
                  columns:
                    - column:
                        name: document_id