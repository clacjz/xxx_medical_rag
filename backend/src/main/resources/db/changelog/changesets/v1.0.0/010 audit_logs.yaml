databaseChangeLog:
  - changeSet:
      id: create-audit-logs-table
      author: system
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
              - column:
                  name: display_name
                  type: VARCHAR(200)
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: level
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: INFO
              - column:
                  name: resource_type
                  type: VARCHAR(100)
              - column:
                  name: resource_id
                  type: VARCHAR(100)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: ip_address
                  type: VARCHAR(50)
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(10)
                  defaultValue: success
            indexes:
              - index:
                  name: idx_audit_user_id
                  tableName: audit_logs
                  columns:
                    - column:
                        name: user_id
              - index:
                  name: idx_audit_action
                  tableName: audit_logs
                  columns:
                    - column:
                        name: action
              - index:
                  name: idx_audit_level
                  tableName: audit_logs
                  columns:
                    - column:
                        name: level
              - index:
                  name: idx_audit_timestamp
                  tableName: audit_logs
                  columns:
                    - column:
                        name: timestamp