databaseChangeLog:
  - changeSet:
      id: create-chat-messages-table
      author: system
      changes:
        - createTable:
            tableName: chat_messages
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: sources
                  type: JSONB
              - column:
                  name: query_params
                  type: JSONB
              - column:
                  name: model_info
                  type: JSONB
              - column:
                  name: token_usage
                  type: JSONB
              - column:
                  name: generation_time_ms
                  type: INTEGER
              - column:
                  name: feedback
                  type: VARCHAR(16)
              - column:
                  name: feedback_comment
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
            indexes:
              - index:
                  name: idx_chat_messages_session_id
                  tableName: chat_messages
                  columns:
                    - column:
                        name: session_id