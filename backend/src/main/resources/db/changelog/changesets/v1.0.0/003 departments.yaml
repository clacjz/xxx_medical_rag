databaseChangeLog:
  - changeSet:
      id: create-departments-table
      author: system
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: VARCHAR(36)
              - column:
                  name: manager_id
                  type: VARCHAR(36)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: active
              - column:
                  name: is_default
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValue: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
            indexes:
              - index:
                  name: idx_departments_code
                  tableName: departments
                  columns:
                    - column:
                        name: code
              - index:
                  name: idx_departments_parent_id
                  tableName: departments
                  columns:
                    - column:
                        name: parent_id