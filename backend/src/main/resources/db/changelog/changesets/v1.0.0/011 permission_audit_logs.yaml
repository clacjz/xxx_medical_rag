databaseChangeLog:
  - changeSet:
      id: create-permission-audit-logs-table
      author: system
      changes:
        - createTable:
            tableName: permission_audit_logs
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: operator_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: operation_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: old_value
                  type: JSONB
              - column:
                  name: new_value
                  type: JSONB
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
            indexes:
              - index:
                  name: idx_permission_audit_target
                  tableName: permission_audit_logs
                  columns:
                    - column:
                        name: target_type
                    - column:
                        name: target_id