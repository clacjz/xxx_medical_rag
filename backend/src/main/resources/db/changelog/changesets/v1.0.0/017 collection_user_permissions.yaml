databaseChangeLog:
  - changeSet:
      id: create-collection-user-permissions-table
      author: system
      changes:
        - createTable:
            tableName: collection_user_permissions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: collection_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: permission_level
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: granted_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
            indexes:
              - index:
                  name: idx_collection_user_permissions_collection_id
                  tableName: collection_user_permissions
                  columns:
                    - column:
                        name: collection_id
              - index:
                  name: idx_collection_user_permissions_user_id
                  tableName: collection_user_permissions
                  columns:
                    - column:
                        name: user_id