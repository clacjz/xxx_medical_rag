databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: system
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(100)
              - column:
                  name: role
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                  defaultValue: DEPT_USER
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                  defaultValue: ACTIVE
              - column:
                  name: login_fail_count
                  type: INTEGER
                  constraints:
                    nullable: false
                  defaultValue: 0
              - column:
                  name: lock_until
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
            indexes:
              - index:
                  name: idx_users_username
                  tableName: users
                  columns:
                    - column:
                        name: username
              - index:
                  name: idx_users_email
                  tableName: users
                  columns:
                    - column:
                        name: email