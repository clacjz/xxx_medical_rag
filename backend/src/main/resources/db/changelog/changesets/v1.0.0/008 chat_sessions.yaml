databaseChangeLog:
  - changeSet:
      id: create-chat-sessions-table
      author: system
      changes:
        - createTable:
            tableName: chat_sessions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(256)
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: collection_ids
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  defaultValue: ACTIVE
              - column:
                  name: message_count
                  type: INTEGER
                  defaultValue: 0
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: last_message_at
                  type: TIMESTAMP
            indexes:
              - index:
                  name: idx_chat_sessions_user_id
                  tableName: chat_sessions
                  columns:
                    - column:
                        name: user_id
              - index:
                  name: idx_chat_sessions_department_id
                  tableName: chat_sessions
                  columns:
                    - column:
                        name: department_id