databaseChangeLog:
  - changeSet:
      id: create-user-departments-table
      author: system
      changes:
        - createTable:
            tableName: user_departments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValue: true
              - column:
                  name: position
                  type: VARCHAR(100)
              - column:
                  name: joined_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
            constraints:
              - uniqueConstraint:
                  constraintName: uk_user_departments_user_dept
                  tableName: user_departments
                  columnNames: user_id, department_id