databaseChangeLog:
  - changeSet:
      id: create-collection-permissions-table
      author: system
      changes:
        - createTable:
            tableName: collection_permissions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: collection_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: permission_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: granted_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP