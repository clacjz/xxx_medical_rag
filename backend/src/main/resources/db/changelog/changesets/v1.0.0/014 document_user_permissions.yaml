databaseChangeLog:
  - changeSet:
      id: create-document-user-permissions-table
      author: system
      changes:
        - createTable:
            tableName: document_user_permissions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: permission_level
                  type: VARCHAR(20)
                  defaultValue: READ
              - column:
                  name: granted_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
            constraints:
              - uniqueConstraint:
                  constraintName: uk_document_user_permissions
                  tableName: document_user_permissions
                  columnNames: document_id, user_id