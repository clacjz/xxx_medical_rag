databaseChangeLog:
  - changeSet:
      id: create-collections-table
      author: system
      changes:
        - createTable:
            tableName: collections
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  defaultValue: KNOWLEDGE_BASE
              - column:
                  name: config
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  defaultValue: ACTIVE
              - column:
                  name: document_count
                  type: INTEGER
                  defaultValue: 0
              - column:
                  name: chunk_count
                  type: BIGINT
                  defaultValue: 0
              - column:
                  name: total_size
                  type: BIGINT
                  defaultValue: 0
              - column:
                  name: department_id
                  type: VARCHAR(36)
              - column:
                  name: owner_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP
            indexes:
              - index:
                  name: idx_collections_name
                  tableName: collections
                  columns:
                    - column:
                        name: name
              - index:
                  name: idx_collections_owner_id
                  tableName: collections
                  columns:
                    - column:
                        name: owner_id
              - index:
                  name: idx_collections_department_id
                  tableName: collections
                  columns:
                    - column:
                        name: department_id