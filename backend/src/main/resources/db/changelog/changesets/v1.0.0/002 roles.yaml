databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: system
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: level
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: permissions
                  type: TEXT
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValue: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
            indexes:
              - index:
                  name: idx_roles_code
                  tableName: roles
                  columns:
                    - column:
                        name: code